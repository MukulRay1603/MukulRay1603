<svg xmlns="http://www.w3.org/2000/svg" width="430" height="286" viewBox="0 0 430 286" role="img" aria-label="PharmaChain: AI cargo monitor for pharma cold-chain risk. 12–15 s from alert to an approved plan, vs the usual 6–8 hours."><title>PharmaChain: AI cargo monitor for pharma cold-chain risk. 12–15 s from alert to an approved plan, vs the usual 6–8 hours.</title><style>@font-face{font-family:'Cinzel';src:url(data:font/woff2;base64,) format('woff2');font-weight:200 1000}@font-face{font-family:'Nunito Sans';src:url(data:font/woff2;base64,) format('woff2');font-weight:200 1000}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.18);opacity:.55}}.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3.6s ease-out infinite}@keyframes ripple{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}.rot{animation:spin 14s linear infinite}.rotf{animation:spin 4s linear infinite}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{50%{opacity:.15}}.ecg{stroke-dasharray:28 72;animation:ecg 2.6s linear infinite}@keyframes ecg{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.75" y="0.75" width="428.5" height="284.5" rx="16" fill="#fffcf5" stroke="rgba(138,100,32,.45)" stroke-width="1.5"/><path d="M28 -4l4 4-4 4-4-4z" fill="#0e6a4e"/><path d="M402 282l4 4-4 4-4-4z" fill="#0e6a4e"/><rect x="1.5" y="1.5" width="4.5" height="283" rx="2.2" fill="#0e6a4e"/><g transform="translate(358 72) scale(.74)"><g transform="translate(0 0)" fill="none" stroke="#0e6a4e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-70" y="-44" width="140" height="88" rx="12" stroke-opacity=".35"/><path d="M-62 0H-30L-22 -14L-12 22L-2 -34L8 16L14 0H62" stroke-opacity=".25"/><path d="M-62 0H-30L-22 -14L-12 22L-2 -34L8 16L14 0H62" pathLength="100" class="ecg"/><circle cx="52"