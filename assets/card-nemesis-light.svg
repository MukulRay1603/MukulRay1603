ING</text><text x="26.0" y="74.0" font-family="Cinzel" font-size="24" font-weight="700" fill="#141826" text-anchor="start" letter-spacing="0.4" >Nemesis</text><text x="26.0" y="98.0" font-family="Nunito Sans" font-size="14.5" font-weight="400" fill="#454d66" text-anchor="start" letter-spacing="0" >Distributed RL boss AI with real-time</text><text x="26.0" y="117.0" font-family="Nunito Sans" font-size="14.5" font-weight="400" fill="#454d66" text-anchor="start" letter-spacing="0" >LLM narration</text><text x="26.0" y="166.0" font-family="Cinzel" font-size="34" font-weight="700" fill="#6e4d12" text-anchor="start" letter-spacing="0" >+85%</text><text x="26.0" y="192.0" font-family="Nunito Sans" font-size="14.5" font-weight="400" fill="#1d2232" text-anchor="start" letter-spacing="0" >longer survival than a scripted FSM boss</text><rect x="26" y="236" width="48.3" height="28" rx="14" fill="none" stroke="rgba(138,100,32,.45)"/><text x="50.1" y="255.0" font-family="Nunito Sans" font-size="12.5" font-weight="700" fill="#1d2232" text-anchor="middle" letter-spacing="0" >PPO</text><rect x="81.27475000000001" y="236" width="77.0" height="28" rx="14" fill="none" stroke="rgba(138,100,32,.45)"/><text x="119.8" y="255.0" font-family="Nunito Sans" font-size="12.5" font-weight="700" fill="#1d2232" text-anchor="middle" letter-spacing="0" >Ray RLlib</text><rect x="165.31525000000002" y="236" width="59.7" height="28" rx="14" fill="none" stroke="rgba(138,100,32,.45)"/><text x="195.2" y="255.0" font-family="Nunito Sans" font-size="12.5" font-weight="700" fill="#1d2232" text-anchor="middle" letter-spacing="0" >ONNX</text><rect x="232.02475000000004" y="236" width="91.4" height="28" rx="14" fill="none" stroke="rgba(138,100,32,.45)"/><text x="277.7" y="255.0" font-family="Nunito Sans" font-size="12.5" font-weight="700" fill="#1d2232" text-anchor="middle" letter-spacing="0" >Unity Sentis</text></svg>